# Generated By: Claude Code (Claude Opus 4.6)
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant-dashboard"
version = "0.1.0"
description = "CLI-first personal task management with voice input, powered by Claude"
requires-python = ">=3.12"
dependencies = [
    "agentpulse[client] @ git+https://github.com/jewzaam/agentpulse.git@v0.1.1",
    "claude-agent-sdk>=0.1.50",
    "local-transcribe @ git+https://github.com/jewzaam/local-transcribe.git@v0.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]
dev = [
    "black>=23.0",
    "flake8>=6.0",
    "mutmut>=2.0,<3.0",
    "mypy==1.11.2",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "types-PyYAML>=6.0",
    "xenon>=0.9",
]

[project.scripts]
pa = "personal_assistant_dashboard.__main__:main"

[tool.setuptools.packages.find]
include = ["personal_assistant_dashboard*"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["agentpulse.*", "claude_agent_sdk.*", "local_transcribe.*", "local_transcribe_ui.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that use real subprocess/filesystem/network operations",
]

[tool.coverage.run]
omit = [
    "personal_assistant_dashboard/dashboard.py",
    "personal_assistant_dashboard/config.py",
    "personal_assistant_dashboard/chat_client.py",
    "personal_assistant_dashboard/chat_tab.py",
    "personal_assistant_dashboard/info_tab.py",
    "personal_assistant_dashboard/settings_tab.py",
    "personal_assistant_dashboard/startup.py",
]

[tool.coverage.report]
fail_under = 80
