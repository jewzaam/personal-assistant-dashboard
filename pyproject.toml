# Generated By: Claude Code (Claude Opus 4.6)
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "0.1.0"
description = "CLI-first personal task management with voice input, powered by Claude"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.50",
    "pyyaml>=6.0",
    "tkinterweb>=3.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "flake8>=6.0",
    "mutmut>=2.0,<3.0",
    "mypy==1.11.2",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
pa = "personal_assistant.__main__:main"

[tool.setuptools.packages.find]
include = ["personal_assistant*"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["tkinterweb.*", "claude_agent_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that use real subprocess/filesystem/network operations",
]

[tool.coverage.run]
omit = [
    "personal_assistant/dashboard.py",
    "personal_assistant/pages_tab.py",
    "personal_assistant/config.py",
    "personal_assistant/chat_client.py",
    "personal_assistant/chat_tab.py",
    "personal_assistant/settings_tab.py",
    "personal_assistant/startup.py",
    "personal_assistant/utils.py",
]

[tool.coverage.report]
fail_under = 80
